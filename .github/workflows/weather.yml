name: Weather SVG
on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时更新一次
  workflow_dispatch:          # 支持手动触发
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 从 main 检出，拿到 .github/scripts/weather.py
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          path: repo-main

      # 2. 用 main 里的脚本，把 SVG 生成到 repo-main/output/weather.svg
      - name: Generate weather SVG
        working-directory: repo-main
        run: python .github/scripts/weather.py

      # 3. 确认文件生成
      - name: Verify
        run: ls -la repo-main/output/weather.svg

      # 4. 检出 output 分支，把生成的 SVG 复制进去并提交
      - uses: actions/checkout@v5
        with:
          ref: output
          fetch-depth: 0
          path: repo-output

      - name: Copy SVG into output branch
        run: cp repo-main/output/weather.svg repo-output/weather.svg

      - name: Commit & push to output
        working-directory: repo-output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add weather.svg
          git commit -m "update weather" || echo "no change"
          git push origin output
