name: Weather SVG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：从 main 检出，拿到 weather.py 脚本
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # 第二步：跑脚本，生成 output/weather.svg
      - name: Generate weather SVG
        run: python .github/scripts/weather.py

      # 第三步：确认文件生成了
      - name: Verify
        run: ls -la weather.svg

      # 第四步：切换到 output 分支，只提交 SVG
      - name: Commit & push to output
        run: |
          rm -f weather.svg
          git fetch origin output
          git checkout --track origin/output || git checkout -b output origin/output
          python .github/scripts/weather.py
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add weather.svg
          git commit -m "update weather" || echo "no change"
          git push origin output
          git add weather.svg
          git commit -m "update weather" || echo "no change"
          git push origin output
