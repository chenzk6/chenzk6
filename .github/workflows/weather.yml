name: Weather SVG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: output        # 切到 output 分支
          fetch-depth: 0

      - name: Generate weather SVG
        run: python .github/scripts/weather.py

      - name: Verify file generated
        run: ls -la output/weather.svg   # 确认文件真的生成了

      - name: Commit & push to output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/weather.svg
          git commit -m "update weather" || echo "no change"
          git push origin output
